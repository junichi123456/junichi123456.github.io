# =====================================================================
#  河沿要（仮称）設計条件 — docs/kawazanyo_design_brief_v3.md の数値版
#  `python3 src/build.py` で 図面（DXF/PDF/PNG）・法規チェック・3D を再生成
#  単位: mm（面積 m²）。敷地・地形データは data/site_gsi.json（国土地理院）
# =====================================================================
project:
  name: 河沿要（仮称）新築計画
  short: KAWAZANYO
  location: 東京都八王子市大和田町7丁目
  designer: 設計検討（仮）
  date: "2026-11-26"
  phase: 基本計画

site:
  data: data/site_gsi.json
  building_origin_m: [-5.505, -17.005]   # 建物 X1・Y1 壁芯交点のローカル座標(m)
  gl_tp: 109.0                 # 設計GL = 南側道路面 TP(m)
  fgl: 450                     # 敷地仕上げ地盤（現況維持）
  zoning: 準工業地域（推定・要確認）
  fire_zone: 指定未確認（耐火建築物で計画）
  coverage_limit: 0.60
  far_limit: 2.00
  road_far_factor: 0.6         # 住居系以外
  road_slope: 1.5
  road_slope_range: 20000
  adjacent_slope: {rise: 31000, slope: 2.5}
  south_road_width: 7400       # 基盤地図より計測
  east_road_width: 5500
  east_road_width_with_donation: 7860   # 帯（東側 2,360）が東側道路に編入される場合の幅員（v4.22、要確認）
  flood_depth: 1000            # 想定浸水深（上限）
  cliff: {north_h: 3200, east_h: 3300}   # 敷地外の高低差（DEM）
  donation:                    # v4.22 塀外の帯を市へ割譲（施主の決定。法的扱いは提案・すべて要確認）
    method: "寄付採納を基本（開発許可の対象かを先に確認）。譲渡（売買）・開発に伴う帰属も協議"
    label: "歩行者専用道路（市へ割譲・舗装要件協議）"
    status: 要確認
    pave:                      # 市に指定/協議する舗装要件（提案値）
      - [幅員, "東 2.36〜2.61m、北 0〜6.6m（楔形）", "有効幅は根固め帯を含む"]
      - [路床・路盤, "路床締固め、不織布、砕石（RC-40）150〜200mm", "透水舗装に合わせる"]
      - [表層, "透水性アスファルト 50mm または樹脂系透水舗装", "市の標準に合わせる"]
      - [横断勾配, "1.5〜2%、塀から離れる向き（道路側の側溝へ）", "塀の基礎を濡らさない"]
      - [縦断勾配, "現況 約5.5%（東辺）", "移動等円滑化基準は5%以下・やむを得ない場合8%。要協議"]
      - [耐荷重, "歩行者・自転車・管理車両（2t 程度）", "緊急車両を通すかで変わる"]
      - [緊急車両, "通さない（入口に車止め）", "幅2.4m では消防車は入れない。要協議"]
      - [車止め・ボラード, "両端（北の歩道側・東側道路側）に着脱式", "鍵は市が管理"]
      - [縁石・側溝, "道路側に L 形側溝またはスリット側溝、塀側は縁石なし", ""]
      - [塀の根固め, "塀の足元に幅300 のコンクリート根固め帯", "舗装の一部として市の承認を得る"]
      - [すべり抵抗, "BPN 40 以上（湿潤）", ""]
      - [色, "明るいグレー系（#333333 の車道と見分ける）", "市の指定があれば従う"]
      - [照明, "2200K・下向き・防虫（ブリーフ18章と同じ）", "市の道路照明として協議。だめなら塀に付ける自家用灯（施主管理）"]
      - [排水の流末, "東: 東側道路の側溝、北: 水路（占用協議）", "フラップ弁の放流先もここ"]

requirements:
  indoor:                      # 通年・全室の室内環境目標（施主指定 v4.1）
    summer_t: [25.0, 26.0]
    winter_t: [20.0, 21.0]
    rh: [55, 60]
  use: 一戸建ての住宅
  stories: 2
  stair: {min_width: 750, max_riser: 230, min_tread: 150}   # 令23条（住宅）
  daylight_ratio: 0.1529       # 1/7 + 1ポイント（設計基準）
  daylight_k: 3.0              # 採光補正係数（準工業・上限値、要確認）
  parking: 3
  fence_height: 2000
  fence_watertight: 600        # 止水構造の高さ（FGL基準）

building:
  frame_mm: [18250, 18250]    # v4.41: 敷地との対応の基準外形（旧 v4.40 の壁芯寸法。縮小しても敷地座標系を動かさない）
  orientation: south_road     # 南側道路の道路境界線に平行・直交させる（north: 真北に合わせる）
  grid_x: [5425, 5400, 5425]   # v4.44 通り芯の均等化（壁芯 16.25m 角・外寸 16.74m は不変）。東西 5.425／5.40／5.425（v4.43 5.90／4.45／5.90）
  grid_y: [5425, 5400, 5425]   # v4.44 南北も 5.425／5.40／5.425（v4.43 6.125／6.0／4.125）
  fl_1f: 1500                  # GL 基準
  story_heights: {1F: 3400, 2F: 3400}
  parapet: 600
  ceiling: {1F: 2800, 2F: 2800}
  wall_rc: 250
  insulation: 100
  cladding: 20
  slab: 220
  partition: 100
  base_slab: 350

structure:
  system: 壁式鉄筋コンクリート造（平13国交告1026号）
  concrete: {Fc: 24, Fd: 24, wc_max: 0.50, nominal: "27〜30（W/C 50%を満たす調合・呼び強度30相当の見込み）", cement: 普通ポルトランドセメント（JIS R 5210）, unit_water_max: 185, unit_cement_min: 270, slump: 18, air: [4.5, 1.5], chloride_max: 0.30, asr: "区分A（無害）の骨材 または アルカリ総量 3.0kg/m³ 以下", curing_days: 5}   # v4.40 劣化対策等級3（告示209号 W/C 50% 以下・（ロ）欄）
  rebar: {D10-D16: SD295, D19-D25: SD345}
  cover_min:    {wall_in: 40, wall_out: 50, slab: 30, roof_top: 40, earth_contact: 50, foundation: 70}   # v4.40 告示209号（ロ）欄＋W/C 50%。外断熱面の 10 減は使わない（安全側）
  cover_design: {wall_in: 50, wall_out: 60, slab: 40, roof_top: 50, earth_contact: 60, foundation: 80}   # 最小＋10
  rebar_spec: {std: JIS G 3112, lap: "D16 以下 重ね継手", weld: "D19 以上 ガス圧接", spacer: "土に接する部分・外壁屋外側はコンクリート製", opening: "人通口・スリーブ・床点検口 縦横 2-D13＋斜め 2-D13（構造設計者が確定）"}
  wall_bars: D13@200 ダブル
  slab_bars: D13@200 ダブル（上下端）
  local_thick:      # v4.18: 1F の LDK の壁を室内側へ増し打ち（外断熱面・壁芯は変えない）。偏心率の悪化を抑える
    - {floor: 1F, side: S, u: [-125, 5425], t: 350, dir: in}      # v4.44 LDK の S 壁（X2 まで）
    - {floor: 1F, side: W, u: [-125, 5300], t: 300, dir: in}      # v4.44 LDK の W 壁（Y2 の内面まで）
    - {floor: 1F, side: S, u: [10825, 16375], t: 300, dir: in}   # v4.27（7.png R5）ジムの S 壁を室内側へ +50（内面 125→175）。施主回答: LDK の増し厚と同程度。t250 でも偏心 0.132 ≦0.15 のためオーバースペックを避け t300（有効面積優先）。外面不変。要確認 Q4
    - {floor: 1F, side: E, u: [-125, 5300], t: 300, dir: in}     # v4.27（7.png R6）ジムの E 壁を室内側へ +50（内面 18,125→18,075）。Y2 より北は不変
    # v4.28: 2階の赤線（8.webp R1〜R4）は施主回答で「増し打ちではなく標準厚 t250 の RC 壁の位置・範囲」。local_thick は追加しない（t250 のまま）

windows:      # FIX窓 実ガラス面積（m²）— v2 確定値 + 本計画の提案値
  LDK: 8.4       # v4.37: AW-LS・AW-LW 各 2.1×2.0（コードは使っていない）
  居室A: 0.70
  居室B: 0.70
  ジム: 1.80     # v2 1.65 → 採光基準に合わせて増（ジム 34.5m²）
  2F居室: 0.70   # 2階は未確定 → 1階方針を延長した提案値

glazing:      # 全窓 共通（施主指示 v4.5）: 樹脂サッシ＋Low-E トリプルガラス（FIX）、室外側は UV カット合わせガラス
  frame: 樹脂サッシ（トリプルガラス対応・FIX）
  build_1f: 外 防犯合わせ（CP・UVカット中間膜 60mil）8.8 + Ar16 + 4 + Ar16 + Low-E 5   # 約50mm
  build_2f: 外 防犯合わせ（CP・UVカット中間膜 60mil）8.8 + Ar16 + 4 + Ar16 + Low-E 5   # v4.12 で2階も CP に統一
  low_e: 2       # Low-E 膜 2面（第2・第5面）
  ug: 0.60       # ガラス中央部 W/m²K
  uw: 0.90       # 窓（枠込み）W/m²K
  types:         # 方位ごとの Low-E の種類（g: 日射熱取得率、tv: 可視光透過率）
    gain:   {name: 日射取得型 Low-E トリプル, g: 0.45, tv: 0.62}
    shield: {name: 遮熱型 Low-E トリプル, g: 0.28, tv: 0.50}
  side_type: {S: gain, N: gain, E: shield, W: shield}
  quad:                    # v4.38 LDK の 2 窓だけ Low-E クアッド（Kr）FIX（施主回答 Q8）
    labels: [AW-LS, AW-LW]
    name: Low-E クアッド（Kr）
    build_1f: 外 防犯合わせ（CP・UVカット中間膜 60mil）8.8 + Kr12 + 4 + Kr12 + 4 + Kr12 + Low-E 5   # 約 58mm
    low_e: 3
    ug: 0.35
    uw: 0.65
    types:
      gain:   {name: 日射取得型 Low-E クアッド, g: 0.40, tv: 0.56}
      shield: {name: 遮熱型 Low-E クアッド, g: 0.25, tv: 0.45}
  tuv: 0.01                # 紫外線透過率（UVカット合わせガラス、380nm 以下を約99%カット）
uv_shading:   # 日照の紫外線・日射を外で止める設備（v4.6: 羽根のないZIPスクリーンに変更 — 清掃・故障箇所が少ない）
  type: 外付け電動スクリーン（ZIP型・両側レールで生地を保持・日射/風センサー連動、寝室は完全遮光の生地）
  sides: [S, E, W]
  months: [5, 6, 7, 8, 9]  # 日射の強い時期に自動で下ろす（冬は上げて日射を取り込む）
  fc: 0.15                 # 下ろしたときの日射遮蔽係数（ガラスの g に乗じる・開口率5%の濃色生地）
  box: {h: 200, d: 150}    # スクリーンボックス（外断熱層に埋め込み、外装から30mm出す）
  extra_windows: []        # 提案（要施主確認）: ["主寝室"] を入れると北面の主寝室の窓（AW-5）にも遮光スクリーンを付ける。M-03 の台数が増える。内装CG は interior_cg.propose_north_blackout でこの提案を描く
uv_fraction: 0.05          # 日射に含まれる紫外線（UV-A・B）の割合（エネルギー比の目安）

interior:     # インテリアの一貫方針（施主指示 v4.6）: 「すばらしいデザインは安全であるべき」「清掃とメンテナンスが簡易であるべき」
  principles:
    - すばらしいデザインは安全であるべき — 子どもの頭・指が挟まるすき間、転落・転倒・衝突・感電・絞首の危険をつくらない
    - 清掃とメンテナンスが簡易であるべき — ほこりが溜まる凹凸・目地・溝をつくらず、頻繁な手入れを要する素材・機構を使わない
  guard_height: 1100         # 階段開口まわりの手すり壁（腰壁・すき間なし）
  head_gap: [100, 230]       # 頭部が挟まる開口寸法（この範囲のすき間を床から1.8m以内につくらない）
  finger_gap: [8, 25]        # 指が挟まる開口寸法
  stair: {max_slope: 0.857, step_rule: [550, 650], max_nosing_gap: 30}   # 勾配6/7以下、550≦2R+T≦650、蹴込み30以下（品確法 高齢者等配慮 等級5相当）
  corner_r: 10               # 出隅の丸め R（mm、手の届く高さ）
  furniture: 突っ張り（床・天井）＋家具自体の構造で転倒を防ぐ。RC 壁には固定しない（外断熱の躯体に穴をあけない）
  child_lock_h: 1400         # 子どもの手が届かない補助錠の高さ（mm）

wifi:         # 館内 Wi-Fi（v4.32）: 室ごとの品質。上質な室は -55dBm 以上を全面、水回りは -67dBm 程度に抑える（施主決定）
  standard: Wi-Fi 7（6GHz/5GHz）天井埋込 AP・PoE＋・有線バックホール（Cat6A）。住人用 SSID は 5/6GHz のみ（2.4GHz は IoT 用の非公開 SSID だけ）
  freq_mhz: 5500
  loss:       # dB（5GHz）。RC 壁・スラブの値は仮定（±5dB の誤差。竣工時に実測して AP の出力を合わせる）
    wall: 25.0
    partition: 4.0
    door: 4.0
    stair: 6.0
    glass_door: 3.0
    glass: 3.0       # 室内窓 IW（v4.32 で追加。従前は 0dB）
    slab: 30.0       # 上下階の AP を加える
  rx_h: 1200         # 受信点の高さ（床上、mm）
  ap_h: 2800         # AP の高さ（床上、mm）
  eirp_range: [6, 20]
  premium:           # 上質（11 室、v4.42 で 2F 居室E を除外）: 計算の目標は全面 -55dBm 以上（竣工時の実測は -60 以上・各室 5 点以上。家具・人体の損失を見込み 5dB 厳しく）
    dbm: -55
    measure_dbm: -60
    rooms: [1F リビング・ダイニング, 1F キッチン, 1F ジム, 1F ジム（拡張部）, 2F 居室A, 2F 居室B, 2F 居室C, 2F 居室D, 2F 主寝室, 2F 図書室, 2F シアター]
    wired: [2F 居室A, 2F 居室B, 2F 居室C, 2F 居室D, 1F リビング・ダイニング, 2F シアター]    # 有線の余地
  quiet:             # 水回り（v4.43: 11 室）: 中央値 -70〜-65、上位 10% 値 -62 以下、最小 -75 以上。竣工時の実測は中央値 -67±3
    median: [-70, -65]
    p90_max: -62
    min: -75
    measure: [-70, -64]
    target_dbm: -67
    rooms: [1F 洗面・脱衣, 1F 浴室, 1F トイレ（手洗い付）, 1F 未割当（1F 北東）, 2F トイレ（手洗い付）, 2F トイレ, 2F 収納（北中央）]   # v4.45: 1F トイレを撤去し、旧位置（未割当（1F 北東））を水回りの帯に残す（7 室）
    note: 携帯電話の電波は抑えない（施主の指示の対象外）。壁内の電波減衰材は使わない
  general:           # 一般（廊下・ホール・玄関・ランドリー・ファミクロ・WIC・前室・収納）
    dbm: -67
    cover: 0.90
    min: -75
  aps:               # 固定配置（建物座標 mm、天井）。★ は水回りの調整に使う AP（alt_xy は 1.5m 離れた予備の天井ボックス）。v4.44 で新しい間取りに再配置
    - {id: AP1-1, floor: 1F, xy: [3750, 14250],   eirp: 17,  role: ランドリー・室内干し, via: [C3, C4]}
    - {id: AP1-2, floor: 1F, xy: [13250, 8250],   eirp: 19,  role: ジム, via: [C3, C4]}
    - {id: AP1-3, floor: 1F, xy: [1750, 1750],  eirp: 8, role: リビング・ダイニング, via: []}
    - {id: AP1-4, floor: 1F, xy: [3250, 7800],  eirp: 18,  role: キッチン（v4.45 移設）, via: [C6]}
    - {id: AP1-5, floor: 1F, xy: [3750, 11750], eirp: 6, role: ランドリー・室内干し（水回りの調整）, tune: true, alt_xy: [3750, 13250], via: [C3, C4, C5]}
    - {id: AP1-6, floor: 1F, xy: [8250, 4250],  eirp: 9, role: ホール（水回りの調整）, tune: true, alt_xy: [6750, 4250], via: [C3, C4, C5]}
    - {id: AP1-7, floor: 1F, xy: [12750, 3250], eirp: 17, role: ジム（水回りの調整）, tune: true, alt_xy: [14250, 3250], via: [C7]}
    - {id: AP2-1, floor: 2F, xy: [15750, 12750],   eirp: 13,  role: 図書室, via: [C10, C11, C12]}
    - {id: AP2-2, floor: 2F, xy: [1250, 1750],   eirp: 14,  role: 居室B, via: [C10, C11, C12]}
    - {id: AP2-3, floor: 2F, xy: [4250, 14250],   eirp: 16, role: 未割当（2F 北西）, via: [C10, C13]}
    - {id: AP2-4, floor: 2F, xy: [13250, 7750],  eirp: 19, role: 前室（音響ロック）, via: [C9]}
    - {id: AP2-5, floor: 2F, xy: [15750, 12250],  eirp: 8, role: 図書室, via: [C10, C11]}
    - {id: AP2-6, floor: 2F, xy: [7250, 4250],  eirp: 20,  role: 居室A, via: [C10, C11, C14]}
    - {id: AP2-7, floor: 2F, xy: [15250, 8250],  eirp: 19,  role: 前室（音響ロック）（水回りの調整）, tune: true, alt_xy: [13750, 8250], via: [C10, C11, C14]}
    - {id: AP2-8, floor: 2F, xy: [10250, 11250],  eirp: 6,  role: 未割当（2F 北・東）（水回りの調整）, tune: true, alt_xy: [8750, 11250], via: []}
    - {id: AP2-9, floor: 2F, xy: [750, 7250],  eirp: 12,  role: 居室D, via: [C14]}
  ssid_vlan:         # VLAN と SSID（v4.32）。住人用は 5/6GHz のみ
    - [10, 住人, 5/6GHz の SSID（WPA3）]
    - [20, 制御（IoT）, 2.4GHz の非公開 SSID・機器ごとの鍵（スクリーン・照明・ロボット等）]
    - [30, 防犯, 有線のみ（カメラ・NVR・門のインターホン）]
    - [40, 来客, 5GHz の SSID・端末間の通信を遮断]
    - [99, 管理, 有線のみ（スイッチ・AP の管理）]
  rack:              # 機械室（東系統）MC-6 に集約（v4.31 を踏襲）
    id: MC-6
    xy: [14900, 15600]
    equipment: [パッチパネル Cat6A 48 口×2, ルーター（WAN1 光・WAN2 5G/LTE 自動切替。警備の LTE とは別）, PoE スイッチ 24 口（2.5G・802.3bt・給電 740W 以上）, 有線用スイッチ 24 口（10G アップリンク）, ONU, KNX/Matter ゲートウェイ, NVR, UPS 1.5kVA]
    poe_budget_w: 740
    poe_loads: [[AP, 16, 30], [カメラ, 4, 15], [門のインターホン, 1, 15], [予備, 3, 30]]    # 種類・台数・1 台あたり W
    ups: {kva: 1.5, load_kw: 0.6, min_runtime_min: 15, note: 切替時の瞬断用。長い停電は蓄電池の特定負荷「ネットワーク・警備」から給電}
