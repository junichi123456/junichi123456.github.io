lighting:       # 製品未確定・仮定値。目標照度は JIS Z 9110 を参考にした仮定の目標値（規格本文は未参照）
  policy: 主照明は天井直付けの棒状（ライン）LED、埋込ダウンライトは弱い補助灯（溝・コーブ・吊りなし）
  maintenance_factor: 0.8
  refl_table: {IV1: 0.880, IV2: 0.854, C2: 0.912, W1: 0.003, W2: 0.022, W3: 0.069, W4: 0.056, W5: 0.043, F1: 0.189, F2: 0.792, F3: 0.682, F4: 0.576, F5: 0.360}   # v4.29 配色の反射率（sRGB の相対輝度 Y＝LRV。lighting.refl_factor が palette から同じ値を求める）
  efficacy_lm_per_w: 120
  line: {width: 50, height: 60, drop: 60, classes_lm_per_m: [600, 800, 1000, 1200, 1600, 2000, 2500, 3000, 3500], kelvin: [2200, 5000], ra: 90, dimming: DALI-2 DT8（製品未確定）, row_pitch: 2000, end_clear: 500, hole_clear: 150, cut_unit: 300}
  downlight: {max_lm: 250, kelvin: [2200, 3000], ra: 90, min_from_line: 450, min_from_wall: 400, pitch: 1800}
  foot: {height_from_tread: 300, every_steps: 2, lm: 40, kelvin: 2200, battery_min: 30, plate: [70, 120], protrude: 2}
  targets_lx: {未割当: 100, リビング: 300, キッチン: 300, 玄関土間: 200, ホール・階段: 150, ホール: 200, ジム: 500, トイレ: 200, 機械室: 200, ランドリー: 300, クローゼット: 200, 洗面: 300, 脱衣所: 300, 浴室: 200, シャワー: 200, 廊下: 100, 居室: 200, WIC: 200, シアター: 200, 前室: 100, 図書室: 300, 主寝室: 200}
  foot_line:       # v4.28（施主追加指示）全廊下・ホールの壁 床上 300 に連続ラインの足元灯。遠藤照明 Linear series を第一候補とする。型番・DALI・防塵・光束は要確認の仮定値
    height: 300
    base_lm_per_m: 20          # 通常区間（光束 20〜50 lm/m の下限）
    warn_lm_per_m: 30          # 死角の警告区間（角・T字・戸口・階段口の前後）
    floor_fraction: 0.15       # 器具が放つ光のうち床へ向かう割合の仮定（壁面を照らす配光・下向きカット）。床面照度 1〜3 lx に収める
    warn_radius: {corner: 600, door_extra: 300, stair: 600}   # 警告区間の半径（戸口は 戸の幅/2 + door_extra）
    door_margin: 50            # 戸・開口の両脇を切る量
    min_piece: 200
    target_lx: [1, 3]
    battery_min: 30            # 停電時は内蔵電池で点灯（階段の足元灯と同じ仮定。要確認）
    status: 製品未確定（遠藤照明 Linear series 第一候補。型番・DALI 対応・防塵等級・光束は要確認）
  no_line_rooms: [収納, 式台, PS-]   # v4.44: パイプスペース（PS-2・PS-3）は照明なし
  storage_light: {ids: [L-K2, H-S4, R-S1], lm: 250, kelvin: 3000, off_s: 30}   # v4.38 施主回答 Q9: 奥行 800 以上の収納だけ人感 LED
  battery_room: {target_lx: 200, L: 1200, lm_per_m: 1500}   # v4.26 蓄電室 防湿 LED 2 灯（非常時は蓄電池から）
  channels:        # 時刻 → 各チャネルの (色温度 K, 明るさ %)。L=ライン（主）、D=ダウンライト（弱）、F=足元灯。全体の smart.lighting_schedule は変えない
    # 各点 [時, K, %]。同じ時刻が 2 つ並ぶと階段状に切り替わり、それ以外は線形補間
    L: [[0, 2200, 0], [6, 3000, 0], [6, 3000, 50], [8, 5000, 100], [16, 4500, 100], [18, 3000, 70], [20, 2700, 40], [22, 2200, 10], [22, 2200, 0], [24, 2200, 0]]
    D: [[0, 2200, 10], [6, 2200, 10], [6, 2200, 0], [16, 2200, 0], [16, 2700, 50], [18, 2700, 50], [18, 2700, 70], [20, 2700, 70], [20, 2200, 70], [22, 2200, 40], [22, 2200, 30], [24, 2200, 10]]
    F: [[0, 2200, 30], [6, 2200, 30], [6, 2200, 0], [22, 2200, 0], [22, 2200, 30], [24, 2200, 30]]
  dali: {systems_per_floor: 3, devices_per_system: 64, groups_per_system: 16, gateway: KNX-DALI ゲートウェイ（型番未選定）}
  product: {candidate: 遠藤照明 Linear series（直付・拡散・調光調色 Synca）, status: 製品未確定（型番・DALI 対応・防塵等級は要確認）, alt: Zumtobel SLOTLIGHT infinity II}
  hex: {tested: true, adopted: false, product: Nanoleaf Shapes Hexagons, checked: "2026-10-25",
        reason: 実在するが壁用・装飾用。天井へのテープ取付不可（落下は保証外）、1枚 100lm・Ra80 で LDK 300lx に 217〜270 枚、継ぎ目と段差が総延長約 150m 残り清掃性に反する}

