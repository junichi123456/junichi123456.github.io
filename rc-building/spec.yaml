# =====================================================================
#  河沿要（仮称）設計条件 — docs/kawazanyo_design_brief_v3.md の数値版
#  `python3 src/build.py` で 図面（DXF/PDF/PNG）・法規チェック・3D を再生成
#  単位: mm（面積 m²）。敷地・地形データは data/site_gsi.json（国土地理院）
# =====================================================================
project:
  name: 河沿要（仮称）新築計画
  short: KAWAZANYO
  location: 東京都八王子市大和田町7丁目
  designer: 設計検討（仮）
  date: "2026-10-03"
  phase: 基本計画

site:
  data: data/site_gsi.json
  building_origin_m: [-5.505, -17.005]   # 建物 X1・Y1 壁芯交点のローカル座標(m)
  gl_tp: 109.0                 # 設計GL = 南側道路面 TP(m)
  fgl: 450                     # 敷地仕上げ地盤（現況維持）
  zoning: 準工業地域（推定・要確認）
  fire_zone: 指定未確認（耐火建築物で計画）
  coverage_limit: 0.60
  far_limit: 2.00
  road_far_factor: 0.6         # 住居系以外
  road_slope: 1.5
  road_slope_range: 20000
  adjacent_slope: {rise: 31000, slope: 2.5}
  south_road_width: 7400       # 基盤地図より計測
  east_road_width: 5500
  east_road_width_with_donation: 7860   # 帯（東側 2,360）が東側道路に編入される場合の幅員（v4.22、要確認）
  flood_depth: 1000            # 想定浸水深（上限）
  cliff: {north_h: 3200, east_h: 3300}   # 敷地外の高低差（DEM）
  donation:                    # v4.22 塀外の帯を市へ割譲（施主の決定。法的扱いは提案・すべて要確認）
    method: "寄付採納を基本（開発許可の対象かを先に確認）。譲渡（売買）・開発に伴う帰属も協議"
    label: "歩行者専用道路（市へ割譲・舗装要件協議）"
    status: 要確認
    pave:                      # 市に指定/協議する舗装要件（提案値）
      - [幅員, "東 2.36〜2.61m、北 0〜6.6m（楔形）", "有効幅は根固め帯を含む"]
      - [路床・路盤, "路床締固め、不織布、砕石（RC-40）150〜200mm", "透水舗装に合わせる"]
      - [表層, "透水性アスファルト 50mm または樹脂系透水舗装", "市の標準に合わせる"]
      - [横断勾配, "1.5〜2%、塀から離れる向き（道路側の側溝へ）", "塀の基礎を濡らさない"]
      - [縦断勾配, "現況 約5.5%（東辺）", "移動等円滑化基準は5%以下・やむを得ない場合8%。要協議"]
      - [耐荷重, "歩行者・自転車・管理車両（2t 程度）", "緊急車両を通すかで変わる"]
      - [緊急車両, "通さない（入口に車止め）", "幅2.4m では消防車は入れない。要協議"]
      - [車止め・ボラード, "両端（北の歩道側・東側道路側）に着脱式", "鍵は市が管理"]
      - [縁石・側溝, "道路側に L 形側溝またはスリット側溝、塀側は縁石なし", ""]
      - [塀の根固め, "塀の足元に幅300 のコンクリート根固め帯", "舗装の一部として市の承認を得る"]
      - [すべり抵抗, "BPN 40 以上（湿潤）", ""]
      - [色, "明るいグレー系（#333333 の車道と見分ける）", "市の指定があれば従う"]
      - [照明, "2200K・下向き・防虫（ブリーフ18章と同じ）", "市の道路照明として協議。だめなら塀に付ける自家用灯（施主管理）"]
      - [排水の流末, "東: 東側道路の側溝、北: 水路（占用協議）", "フラップ弁の放流先もここ"]

requirements:
  indoor:                      # 通年・全室の室内環境目標（施主指定 v4.1）
    summer_t: [25.0, 26.0]
    winter_t: [20.0, 21.0]
    rh: [55, 60]
  use: 一戸建ての住宅
  stories: 2
  stair: {min_width: 750, max_riser: 230, min_tread: 150}   # 令23条（住宅）
  daylight_ratio: 0.1529       # 1/7 + 1ポイント（設計基準）
  daylight_k: 3.0              # 採光補正係数（準工業・上限値、要確認）
  parking: 3
  fence_height: 2000
  fence_watertight: 600        # 止水構造の高さ（FGL基準）

building:
  orientation: south_road     # 南側道路の道路境界線に平行・直交させる（north: 真北に合わせる）
  grid_x: [6125, 6000, 6125]   # 壁芯（内寸 18,000 角・B案: 中央スパン 6.0m）
  grid_y: [6125, 6000, 6125]
  fl_1f: 1500                  # GL 基準
  story_heights: {1F: 3400, 2F: 3400}
  parapet: 600
  ceiling: {1F: 2800, 2F: 2800}
  wall_rc: 250
  insulation: 100
  cladding: 20
  slab: 220
  partition: 100
  base_slab: 350

structure:
  system: 壁式鉄筋コンクリート造（平13国交告1026号）
  concrete: {Fc: 24}
  rebar: {D10-D16: SD295, D19-D25: SD345}
  cover: {wall: 40, slab: 30, earth_contact: 50, foundation: 70}
  wall_bars: D13@200 ダブル
  slab_bars: D13@200 ダブル（上下端）
  local_thick:      # v4.18: 1F の LDK の壁を室内側へ増し打ち（外断熱面・壁芯は変えない）。偏心率の悪化を抑える
    - {floor: 1F, side: S, u: [-125, 6125], t: 350, dir: in}
    - {floor: 1F, side: W, u: [-125, 6125], t: 300, dir: in}
  corner_post: {shape: 丸鋼, d: 90, center: [0, 0], z: [700, 2700], load: 鉛直荷重のみ（ピン）, fire: 耐火塗料 1h（大臣認定品・白）, N_long_kN: 200, fy: 235}

windows:      # FIX窓 実ガラス面積（m²）— v2 確定値 + 本計画の提案値
  LDK: 16.0      # v4.18: 南西のコーナー大開口（AW-LS 4.125×2.0 + AW-LW 3.875×2.0）
  居室A: 0.70
  居室B: 0.70
  ジム: 1.80     # v2 1.65 → 採光基準に合わせて増（ジム 34.5m²）
  2F居室: 0.70   # 2階は未確定 → 1階方針を延長した提案値

glazing:      # 全窓 共通（施主指示 v4.5）: 樹脂サッシ＋Low-E トリプルガラス（FIX）、室外側は UV カット合わせガラス
  frame: 樹脂サッシ（トリプルガラス対応・FIX）
  build_1f: 外 防犯合わせ（CP・UVカット中間膜 60mil）8.8 + Ar16 + 4 + Ar16 + Low-E 5   # 約50mm
  build_2f: 外 防犯合わせ（CP・UVカット中間膜 60mil）8.8 + Ar16 + 4 + Ar16 + Low-E 5   # v4.12 で2階も CP に統一
  low_e: 2       # Low-E 膜 2面（第2・第5面）
  ug: 0.60       # ガラス中央部 W/m²K
  uw: 0.90       # 窓（枠込み）W/m²K
  types:         # 方位ごとの Low-E の種類（g: 日射熱取得率、tv: 可視光透過率）
    gain:   {name: 日射取得型 Low-E トリプル, g: 0.45, tv: 0.62}
    shield: {name: 遮熱型 Low-E トリプル, g: 0.28, tv: 0.50}
  side_type: {S: gain, N: gain, E: shield, W: shield}
  tuv: 0.01                # 紫外線透過率（UVカット合わせガラス、380nm 以下を約99%カット）
uv_shading:   # 日照の紫外線・日射を外で止める設備（v4.6: 羽根のないZIPスクリーンに変更 — 清掃・故障箇所が少ない）
  type: 外付け電動スクリーン（ZIP型・両側レールで生地を保持・日射/風センサー連動、寝室は完全遮光の生地）
  sides: [S, E, W]
  months: [5, 6, 7, 8, 9]  # 日射の強い時期に自動で下ろす（冬は上げて日射を取り込む）
  fc: 0.15                 # 下ろしたときの日射遮蔽係数（ガラスの g に乗じる・開口率5%の濃色生地）
  box: {h: 200, d: 150}    # スクリーンボックス（外断熱層に埋め込み、外装から30mm出す）
  corner: shared_rail_post  # v4.18: LDK 角は南・西の 2 台がコーナーレール支柱を共用し、ボックスを 45° の留めで 1 体にする
  extra_windows: []        # 提案（要施主確認）: ["主寝室"] を入れると北面の主寝室の窓（AW-5）にも遮光スクリーンを付ける。M-03 の台数が増える。内装CG は interior_cg.propose_north_blackout でこの提案を描く
uv_fraction: 0.05          # 日射に含まれる紫外線（UV-A・B）の割合（エネルギー比の目安）

interior:     # インテリアの一貫方針（施主指示 v4.6）: 「すばらしいデザインは安全であるべき」「清掃とメンテナンスが簡易であるべき」
  principles:
    - すばらしいデザインは安全であるべき — 子どもの頭・指が挟まるすき間、転落・転倒・衝突・感電・絞首の危険をつくらない
    - 清掃とメンテナンスが簡易であるべき — ほこりが溜まる凹凸・目地・溝をつくらず、頻繁な手入れを要する素材・機構を使わない
  guard_height: 1100         # 階段開口まわりの手すり壁（腰壁・すき間なし）
  head_gap: [100, 230]       # 頭部が挟まる開口寸法（この範囲のすき間を床から1.8m以内につくらない）
  finger_gap: [8, 25]        # 指が挟まる開口寸法
  stair: {max_slope: 0.857, step_rule: [550, 650], max_nosing_gap: 30}   # 勾配6/7以下、550≦2R+T≦650、蹴込み30以下（品確法 高齢者等配慮 等級5相当）
  corner_r: 10               # 出隅の丸め R（mm、手の届く高さ）
  furniture: 突っ張り（床・天井）＋家具自体の構造で転倒を防ぐ。RC 壁には固定しない（外断熱の躯体に穴をあけない）
  child_lock_h: 1400         # 子どもの手が届かない補助錠の高さ（mm）

wifi:         # 館内 Wi-Fi（v4.7）: 天井 AP を PoE 有線で接続、5GHz で受信 -67dBm 以上を床面の98%以上
  standard: Wi-Fi 7（6GHz/5GHz/2.4GHz）天井埋込 AP・PoE＋・有線バックホール（Cat6A）
  freq_mhz: 5500
  eirp_dbm: 20
  target_dbm: -67
  target_cover: 0.98
  grid: 500

smart:        # 建物の制御（v4.7）: スクリーン・照明・空調・掃除ロボットを共通の制御基盤でつなぎ、bot から API で操作できる
  bus: KNX（有線）＋ Matter over Thread/Wi-Fi（ゲートウェイ）
  api: ローカル API（ゲートウェイ）＋ HEMS（ECHONET Lite）
  safety: 強風・凍結・火災・停電時は自動制御・手元スイッチが bot の指令より優先
  lighting_schedule:          # 時刻 → (色温度 K, 明るさ %)
    - [0, 2200, 10]
    - [5, 2200, 10]
    - [6, 3000, 50]
    - [8, 5000, 100]
    - [16, 4500, 100]
    - [18, 3000, 70]
    - [20, 2700, 40]
    - [22, 2200, 15]
    - [24, 2200, 10]
  screen_winter_night: {months: [12, 1, 2, 3], from: 日没, to: 日の出, target: LDK 角窓の ZIP スクリーン（南・西）, reason: 結露対策（角の方立の表面温度）と防犯}   # v4.18。要施主確認 F-12（手動の別案あり）
  robots: {floors: [1F, 2F], dock: 自動ゴミ収集・給排水直結（水拭き）, max_step: 5, under_clear: [0, 250]}

vehicle_security:   # 車両盗難対策（v4.10）
  gate: 電動スライド門扉 H2,000（目隠し・施錠・開閉センサー・こじ開け検知、停電時は内側からのみ手動解錠）
  bollards: {n: 3, setback: 1200, d: 220, h: 800}   # 車両門扉の内側の電動昇降ボラード（門から setback 北、φd・地上高 h）
  wheel_stop: 前向き駐車（車の前面＝CAN 配線の多いヘッドライト側を敷地の奥へ）
  key_box: 電波遮断キーボックス（玄関ホールの収納内、外壁から5m 以上・RC 壁の内側）
  camera: 赤外線カメラ（940nm・不可視光、虫を寄せない）門・カーポート各2台、録画は機械室・異常時は bot へ通知
  sensor: 塀の内側に赤外線ビームセンサー、門・ボラードの状態を制御基盤に集約

lifestyle:    # Blueprint 型の暮らし（v4.13）: 睡眠・空気・水・食（菜園）・運動・測定
  bedrooms: [居室A, 居室B, 居室C, 居室D, 主寝室]   # 寝室は1部屋に1人
  co2_target: 800          # 寝室の CO2 上限 ppm（就寝中）
  co2_outdoor: 420
  co2_sleep_m3h: 0.014     # 就寝中の CO2 発生量 m³/h・人
  night: [22, 6]           # 就寝時間帯
  bedroom_setpoint: 室ごとに温度を設定（初期値は全室目標の下限 = 夏25℃・冬20℃、±2℃の範囲で変更可）
  blackout: 寝室の外付けスクリーンは完全遮光の生地（開口率0%）
  filter: 全熱交換の給気フィルター ePM1 70%以上（PM2.5 を除去）、CO2・PM2.5・VOC センサーを各寝室と LDK に
  water: 家全体の浄水フィルター（機械室）＋台所に逆浸透膜（RO）浄水器
  measure: "ジムに測定コーナー（体組成計・血圧計）、睡眠・活動の記録を bot に集約。エピゲノム検査は小平の医療機関で定期測定"
  sauna: false             # サウナは設けない

farm:         # 日なたのプランター菜園（v4.13）: パネルの影がない場所に、脚付きプランターを Dotcon+ の上に並べる
  rect: [14500, -9500, 23500, -3500]
  rows: 3
  row_w: 900
  planter_h: 600
  leg: 100                 # 床からの浮かし（土・水を床に触れさせない）
  slab_option: 将来「基礎（RC 土間）の上の農場」とする場合は、t150・水セメント比45%以下・かぶり50・表面に浸透性吸水防止材・勾配1/100、土は防水ライナー＋排水層で床から絶縁し、プランターと同じく脚で浮かせる

security:     # 強盗（闇バイト型）対策（v4.12）: 見せて諦めさせる → 侵入に時間をかけさせる → すぐ知らせる → 逃げ込める
  safe_room: WIC（主寝室）       # 2階・窓なし・RC 壁で囲まれた室を避難室に
  safe_door: 鋼製防犯扉（CP）・内側からのみ施錠・外から解錠不可
  delivery_box: {x: [14000, 14600], d: 600}   # 門の塀に組み込む貫通型宅配ボックス（外から入れて内から取る）
  intercom_x: 12100                            # 人用門扉の西にカメラ付きインターホン（玄関では応対しない）
  cameras:                                      # 赤外線カメラ（不可視光）。建物の四隅と門・カーポート
    - [-1500, -1500]
    - [19750, -1500]
    - [-1500, 19750]
    - [19750, 19750]
    - [12100, -27200]
    - [22800, -27200]
    - [13000, -13000]
    - [21800, -13000]

exterior_lighting:   # 防虫の外構照明（v4.7）
  cct: 2200          # 色温度 K（アンバー寄り・青/紫外をほとんど含まない）
  cutoff: full       # 上方光束なし（下向き・遮光）
  sensor: true       # 人感センサーで必要なときだけ点灯（タイマー併用）
  bollard_h: 600
  spacing: 6000

exterior:
  carport: {w: 8800, d: 6100, h: 2500, kwp_per_m2: 0.19}   # 3台用ソーラーカーポート（パーゴラの影・被覆率による損失を補う）
  screen_wall: {x: [8100, 12100], y: -7000, height: 2700, t: 180}   # 南側道路から玄関を隠す自立壁（FGL基準・独立基礎）
  canopy:                 # v4.18: 玄関から LDK 窓まで続く連続庇（鋼製の片持ちブラケット＋鋼板屋根）。z = 下端の 1FL からの高さ
    z: 2900
    t: 150
    south: {x: [-1245, 10900], depth: 2000}     # 外装面（y −245）からの出
    west: {y: [-245, 4500], depth: 1000}        # x −245 からの出
    accent_x: [7300, 10900]                     # 玄関部分はアクセント色、LDK 側はベース色
    structure: 鋼製ブラケット @1,500（テーパー H 形鋼）＋断熱パッド（熱橋を切る）＋鋼板屋根 1/100
    lights: {k: 2200, pitch: 3000, w: 3}
    downpipes: [[-1100, 4450], [10850, -300]]   # 縦樋（西系統・東系統）。南西の角には置かない
  solar_pergola:                           # 日よけ付き菜園（ソーラーパーゴラ）— 本館と構造的に分離
    rect: [-27000, 11000, -9000, 21000]    # 建物 X1・Y1 基準 mm（西側の庭、18×10m）
    height: 2800                           # 軒高（パネル下端）
    tilt: 10                               # 南向き傾斜 度
    coverage: 0.70                         # パネル被覆率（すき間から光と雨を落とす）
    module_kwp_per_m2: 0.215               # 430W級モジュール（2.0m²）
  dotcon_storage_l_per_m2: 13
  dotcon_zones:      # Dotcon+ の配置（v4.14 施主の再配置図）: 建物座標 mm の多角形。駐車場・アプローチ・日なたの菜園は別に定義
    pergola_and_west: [[-30100, 28800], [-800, 27800], [-800, 25500], [-28050, 26450], [-28050, 23100], [-6600, 22500], [-6950, 7900], [-28600, 8650], [-28600, 500], [-31050, 500]]
    north_east: [[23110, -3240], [25360, 20050], [20760, 25360], [4420, 25850], [4500, 28350], [21930, 27820], [27950, 20880], [25600, -3490]]   # v4.21: 新しい塀の内面から約2.5m の帯（塀芯を 2,650 内側へオフセット、旧 132m² → 122m²）
  retention_tank_m3: 25
  retention_tank_rect: [-21000, 15050, -11000, 17550]    # v4.23: パーゴラの下へ移設（10×2.5×有効1.0m＝25m³）。旧位置 (-23500,22000)-(-18500,27000) はがけ2H範囲に 20.7m² かかっていた
  fence_line: [[-31444, 29585], [22000, 27970], [28110, 20930], [23070, -31175]]   # 塀の線（v4.21、施主の赤線の概算座標。北辺は境界1→2の延長、東辺は境界4→5から約2.4〜2.6m内側）
  fence_line_note: "施主の赤線（v4.21）・要確認 ±0.7m。v4.22 で塀の外面を新しい敷地境界とした"
  gate_vehicle: 5000
  gate_person: 1200
  gate_setback: 4000                     # 門を南側道路の境界から後退させる距離（門前に車1台分の待避スペース）
  gate_person_x: [12400, 13600]          # 人用門扉（X 範囲、建物座標 mm）— v4.10 で東へ（西の角をゴミ置きに）
  gate_vehicle_x: [17400, 22400]         # 車両門扉
