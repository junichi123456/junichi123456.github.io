# ===================== v4.23 ライフライン・蓄電・ソーラー予約ゾーン・雨水貯留槽
# 座標は建物座標 mm（X1・Y1 壁芯交点が原点、南が -y）。「推定」は仕様者の仮定値、「要確認」は法令・基準・協議で決まる事項。
lifeline:
  note: 引込位置・電柱・公共桝・深さはすべて仮置き（要確認）。道路内工事は各事業者・道路管理者の手続き（道路占用）による
  power:
    pole_note: 南側道路の電柱から地中引込（電柱位置は要確認）。新しい境界内に引込柱は立てない
    entry: [15500, -31589]                        # 道路境界の引込点
    switchboard: [15000, -27589, 16000, -27589]   # 門の塀に組込む引込開閉器盤＋電力量計（外面を門前広場に向ける）
    switchboard_min_h: 1200                       # 下端 FGL+1,200 以上（想定浸水深 1.0m）
    trunk: [[15500, -27589], [14200, -27589], [14200, -245]]    # 幹線（地中管路 FEP/PE φ65×2、1本予備）→ 建物南面 → 床下ピット → 機械室（東）主分電盤
    trunk_conduit: PE φ65×2（1本予備）
    hh: [[14200, -27589], [14200, -14000]]        # ハンドホール（曲がり・約30m 以内ごと）
    pv_pergola: [[-9000, 16000], [-245, 16000]]   # パーゴラ東端 → 西面 (-245,16000) スリーブ → ピット → 機械室
    pv_reserve_spare: [[-9500, 9000], [-9500, 16000]]   # 予約ゾーン HH → パーゴラの溝へ合流（予備管路 PE φ65×2）
    pv_reserve_hh: [-9500, 9000]
    pv_carport_note: カーポートは柱に PCS（直流配線を短くする）
    pcs: {pergola: [-9000, 15000], carport: [13000, -19400], battery: [14350, 7000]}   # 屋外 PCS（AC 結合・出力制御）・柱 PCS・蓄電 PCS（蓄電室内）。v4.39 逆潮流なし
    panels: {main: [15750, 13025], essential: [16000, 13800]}   # v4.26 主分電盤・特定負荷分電盤（機械室・東の南壁沿い。壁掛け 600×250。扉 u15,350〜16,150 の軌跡を避け東へ 800）
    essential_loads: [排煙機, 排水ポンプ, 冷蔵庫, ネットワーク・警備, 各階照明1回路, HP空調1系統, HP給湯, IH 1口]
  comm:
    line: [[15800, -31589], [15800, -26500], [14500, -26500], [14500, -245]]   # 光ファイバ 地中引込（別管 φ50×2、1本予備）。電力管と同じ溝・別管・水平離隔 0.3m
    conduit: 別管 φ50×2（1本予備）
