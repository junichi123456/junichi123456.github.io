cg:                # 外観CG（src/render_cg.py。Blender の Python モジュール＋Cycles、CPU）
  resolution: [1920, 1080]
  samples: 128
  time_limit: 420
  eye_h: 1550
  view_transform: Khronos PBR Neutral   # 色の再現を優先（AgX は淡い生成りが灰色に寄るため）
  exposure: {day: 0.0, dusk: -2.0}
  sky_strength: {day: 1.0, dusk: 1.0}
  lamp_strength: 150
  room_strength: 3.0
  textures:        # Poly Haven（CC0・帰属表示不要）のアセットID。実行時に取得し .cache/cg/ に保存。取得できなければ手続き生成
    stucco: white_stucco
    concrete: concrete_wall_008
    porous: gravel_concrete
    dotcon: gravel_embedded_concrete
    gravel: gravel_floor_02
    asphalt: asphalt_02
    grass: sparse_grass
    soil: brown_mud_02
  hdri: {day: kloofendal_48d_partly_cloudy_puresky, dusk: qwantani_dusk_2_puresky}
  site: {lat: 35.667, lon: 139.36, tz: 9}
  cuts:            # cam の z が "eye" のときは足元の地盤＋eye_h（敷地内は FGL）。単位 mm（建物座標）
    C01:  {file: C01_south_gate,        title: 南側道路から門まわり,   cam: [14500, -36800, eye], target: [14500, -27000, 1700], lens: 22, when: "2026-10-24T11:30"}
