interior_cg:       # 内装CG（src/render_cg.py --interior）。14カット（v4.17 で I12・I13、v4.18 で I14 を追加。v4.18 で描き直したのは I01・I02・I03・I14 のみ）。1600×900・64spp は、1カット約 285 秒の実測にもとづく
  resolution: [1600, 900]
  samples: 64
  adaptive_threshold: 0.05
  time_limit: 240       # v4.17: 13 カット＋比較図で 3,600 秒以内にするため 270 → 240
  lamp_w: 30            # ダウンライト1台あたり（100% のとき、Blender の W。目視で決めた値で、実際の光束との換算はしていない）
  pitch_mm: 1800
  k_area_w_per_lm: 0.008   # v4.17: ライン（面光源）の W/lm（既存の Spot 30W を 800lm 相当とした換算）
  k_spot_w_per_lm: 0.0375  # 足元灯・ダウンライト（Spot）の W/lm
  downlight_ratio: 0.30    # v4.17: 埋込ダウンライトは既存の 30%（弱い補助灯）
  room_lamp_weight: {ジム: 1.6, シアター: 2.0, 前室: 1.0}   # 室の種類ごとの係数（直天井で高いジム、暗色仕上げのシアターは強める）
  view_transform: Khronos PBR Neutral
  propose_north_blackout: true   # 提案: 主寝室の北窓（AW-5）にも遮光スクリーンを足す（要施主確認。図面・法規チェックは変えない）
  annotation_band: 36            # 画像の下端に足す帯の高さ（px）。仮置きの注記を画素として入れる
  scenery:         # v4.19: 窓の外の添景（内装CGのみ）。遠景の木の帯。芝・庭木は足さない（南の庭は透水コンクリート・Dotcon+ の設計）
    trees: {r_min_m: 40, r_max_m: 65, bearing_deg: [150, 300], h_min_m: 6, h_max_m: 12, gap_min_m: 6, gap_max_m: 9, seed: 0, trunk: "#4A3F35"}
    planters: true   # 外観 CG（render_cg.py）と同じ菜園・パーゴラのプランター
  textures: {osb: oriented_strand_board, floor: laminate_floor_02, oak: oak_veneer_01, ash: ash_veneer, plywood: plywood, linen: rough_linen, wool: poly_wool_herringbone, rubber: rubber_tiles, marble: marble_01}
  cuts:            # cam/target は建物座標 mm（z は絶対高さ）。screens: up（昼・上げた）/ down（日没後・下ろした）。open_doors は扉の位置タグ（x…y…）と開け方
