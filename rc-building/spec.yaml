# ---------------------------------------------------------------- v4.17: 照明の再構成・透明扉・キッチン全露出（施主指示 2026-10-25）
lighting:       # 製品未確定・仮定値。目標照度は JIS Z 9110 を参考にした仮定の目標値（規格本文は未参照）
  policy: 主照明は天井直付けの棒状（ライン）LED、埋込ダウンライトは弱い補助灯（溝・コーブ・吊りなし）
  maintenance_factor: 0.8
  efficacy_lm_per_w: 120
  line: {width: 50, height: 60, drop: 60, classes_lm_per_m: [600, 800, 1000, 1200, 1600, 2000, 2500, 3000, 3500], kelvin: [2200, 5000], ra: 90, dimming: DALI-2 DT8（製品未確定）, row_pitch: 2000, end_clear: 500, hole_clear: 150, cut_unit: 300}
  downlight: {max_lm: 250, kelvin: [2200, 3000], ra: 90, min_from_line: 450, min_from_wall: 400, pitch: 1800}
  foot: {height_from_tread: 300, every_steps: 2, lm: 40, kelvin: 2200, battery_min: 30, plate: [70, 120], protrude: 2}
  targets_lx: {リビング: 300, キッチン: 300, 玄関土間: 200, ホール・階段: 150, ホール: 200, ジム: 500, トイレ: 200, 機械室: 200, ランドリー: 300, クローゼット: 200, 洗面: 300, 浴室: 200, シャワー: 200, 廊下: 100, 居室: 200, WIC: 200, シアター: 200, 前室: 100, 図書室: 300, 主寝室: 200}
  no_line_rooms: [収納, 式台]
  channels:        # 時刻 → 各チャネルの (色温度 K, 明るさ %)。L=ライン（主）、D=ダウンライト（弱）、F=足元灯。全体の smart.lighting_schedule は変えない
