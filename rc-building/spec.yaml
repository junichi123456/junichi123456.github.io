    - [1.0e-2, 308.0, 38.0, 0]
    - [1.0e-3, 40.6, 9.0, 28.0]
    - [1.0e-4, 13.8, 2.0, 75.0]
  alt_if_k_high: 浸透トレンチ 40m（W0.6×D0.8、砕石空隙30%）を RZ・2H範囲の外・建物から1.5m 以上に、浸透桝を西系統に2基追加、越流は雨水最終桝へ。散水は上水の散水栓
  insect:        # 7.3 防虫
    - [密閉, 槽は全面密閉。点検口はパッキン付き・施錠の密閉蓋（φ600）]
    - [防虫網, 通気管の頂部と越流管の出口に SUS 網（目開き 0.4mm 以下）。越流管の出口はフラップ弁＋網]
    - [流入口, 落ち葉除けストレーナー＋初期雨水カット（沈殿桝）。流入管は水封（トラップ）で蚊の侵入経路を断つ]
