<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>河沿要 設計図・3D</title>
<style>
  :root { --bg:#f5f4f0; --panel:#ffffff; --ink:#1d1d1b; --sub:#6b6a66; --line:#dddbd4; --accent:#b4371f; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#1b1c1e; --panel:#242528; --ink:#ecebe7; --sub:#a3a29d; --line:#3a3b3f; --accent:#ff7a5c; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Hiragino Sans","Noto Sans JP","IPAGothic",system-ui,sans-serif; }
  header { padding:20px 16px 8px; max-width:1280px; margin:auto; }
  h1 { font-size:1.35rem; margin:0 0 4px; }
  header p { margin:0; color:var(--sub); font-size:.9rem; }
  main { max-width:1280px; margin:auto; padding:8px 16px 40px; display:grid; gap:16px; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; min-width:0; }
  h2 { font-size:1rem; margin:0 0 10px; }
  #viewer { position:relative; height:min(70vh,620px); border-radius:8px; overflow:hidden; background:#dfe6ea; }
  #viewer canvas { display:block; width:100%; height:100%; }
  .controls { display:flex; flex-wrap:wrap; gap:8px 16px; margin-top:10px; font-size:.88rem; align-items:center; }
  .controls label { display:inline-flex; gap:4px; align-items:center; cursor:pointer; }
  .controls input[type=range] { width:180px; }
  button { font:inherit; font-size:.85rem; padding:4px 10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:6px; cursor:pointer; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; }
  .stat { border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  .stat b { display:block; font-size:1.15rem; }
  .stat span { color:var(--sub); font-size:.8rem; }
  .gallery { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
  .card { border:1px solid var(--line); border-radius:8px; overflow:hidden; background:#fff; }
  .card img { width:100%; display:block; aspect-ratio:420/297; object-fit:contain; cursor:zoom-in; }
  .card div { padding:6px 8px; font-size:.82rem; color:#1d1d1b; display:flex; justify-content:space-between; gap:6px; }
  .card a { color:var(--accent); }
  table { border-collapse:collapse; width:100%; font-size:.8rem; }
  th, td { border-bottom:1px solid var(--line); padding:5px 6px; text-align:left; vertical-align:top; }
  .tbl { overflow-x:auto; }
  .ok { color:#2d7a3e; font-weight:600; } .chk { color:#b07400; font-weight:600; } .na { color:var(--sub); }
  #lightbox { position:fixed; inset:0; background:rgba(0,0,0,.85); display:none; align-items:center; justify-content:center; z-index:10; padding:12px; }
  #lightbox img { max-width:100%; max-height:100%; background:#fff; }
  .links a { color:var(--accent); margin-right:14px; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<header>
  <h1>河沿要（仮称）— 壁式RC造 2階建て専用住宅：2D図面と3Dモデル</h1>
  <p>八王子市大和田町7丁目。敷地・地形は国土地理院の基盤地図情報・空中写真・DEM5A から推定。図面と3Dモデルは同じモデル（<code>spec.yaml</code>・<code>docs/kawazanyo_design_brief_v3.md</code>）から自動生成しています。</p>
</header>
<main>
  <section>
    <h2>3Dモデル（図面から生成）</h2>
    <div id="viewer"></div>
    <div class="controls" id="layers"></div>
    <div class="controls">
      <label>水平断面 <input type="range" id="clip" min="-0.5" max="9" step="0.05" value="9"> <span id="clipv"></span></label>
      <button data-view="iso">外観</button><button data-view="top">配置</button><button data-view="south">南面</button><button data-view="east">東面</button>
    </div>
  </section>
  <section><h2>建築概要</h2><div class="stats" id="stats"></div></section>
  <section>
    <h2>図面一式</h2>
    <p class="links"><a href="dist/drawings.pdf">PDF（A3 全図面）</a><a href="dist/model.glb">3Dモデル（.glb）</a><a href="dist/LEGAL_CHECK.md">法規チェック（.md）</a><a href="docs/kawazanyo_design_brief_v3.md">設計ブリーフ v3</a><a href="spec.yaml">設計条件（spec.yaml）</a><a href="docs/site_estimate.png">敷地推定図</a></p>
    <div class="gallery" id="gallery"></div>
  </section>
  <section><h2>法規チェック（自動算定）</h2><div class="tbl"><table id="checks"></table></div></section>
</main>
<div id="lightbox"><img alt=""></div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const el = document.getElementById("viewer");
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.localClippingEnabled = true;
renderer.shadowMap.enabled = true;
el.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe6ea);
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 1000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(8.6, 3, -8.6);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f84, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(-20, 35, 25); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -60, right: 60, top: 60, bottom: -60 });
scene.add(sun);
const plane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 9);
const groups = {};
const views = {
  iso: [[-38, 34, 48]], top: [[8.61, 95, -8.6]], south: [[8.6, 6, 48]], east: [[60, 8, -8.6]],
};
function setView(k) { camera.position.set(...views[k][0]); controls.target.set(8.6, 3, -8.6); controls.update(); }
setView("iso");

new GLTFLoader().load("dist/model.glb", (g) => {
  g.scene.traverse((o) => {
    if (!o.isMesh) return;
    const grp = (o.name || o.parent.name).split("|")[0].replace(/_\d+$/, "");
    o.castShadow = o.receiveShadow = true;
    o.material.clippingPlanes = /地形|周辺|水路|塀|外構|カーポート/.test(grp) ? [] : [plane];
    o.material.clipShadows = true;
    (groups[grp] ||= []).push(o);
  });
  scene.add(g.scene);
  const box = document.getElementById("layers");
  for (const k of Object.keys(groups)) {
    const id = "l_" + k;
    box.insertAdjacentHTML("beforeend", `<label><input type="checkbox" id="${id}" ${k === "基礎" ? "" : "checked"}>${k}</label>`);
    const cb = document.getElementById(id);
    const apply = () => groups[k].forEach((m) => (m.visible = cb.checked));
    cb.addEventListener("change", apply); apply();
  }
  window.__ready = true;
});
const clip = document.getElementById("clip"), clipv = document.getElementById("clipv");
const updClip = () => { plane.constant = +clip.value; clipv.textContent = `GL${(+clip.value >= 0 ? "+" : "")}${(+clip.value).toFixed(2)}m`; };
clip.addEventListener("input", updClip); updClip();
document.querySelectorAll("[data-view]").forEach((b) => b.addEventListener("click", () => setView(b.dataset.view)));
function resize() { const w = el.clientWidth, h = el.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });

const data = await (await fetch("dist/index.json")).json();
const s = data.summary;
const stats = [["敷地面積（推定）", s.site_area.toFixed(2) + " m²"], ["建築面積", s.building_area.toFixed(2) + " m²"],
  ["延べ面積", s.total.toFixed(2) + " m²"], ["建ぺい率", (s.coverage * 100).toFixed(2) + " %"],
  ["容積率", (s.far * 100).toFixed(2) + " %"], ["最高高さ（設計GL）", s.height.toFixed(2) + " m"]];
document.getElementById("stats").innerHTML = stats.map(([k, v]) => `<div class="stat"><b>${v}</b><span>${k}</span></div>`).join("");
document.getElementById("gallery").innerHTML = data.sheets.map((d) =>
  `<div class="card"><img loading="lazy" src="${d.png}" alt="${d.number} ${d.title}"><div><span>${d.number} ${d.title}</span><a href="${d.dxf}">DXF</a></div></div>`).join("");
const cls = (r) => (r === "適合" ? "ok" : r === "要確認" ? "chk" : "na");
document.getElementById("checks").innerHTML = "<tr><th>区分</th><th>項目</th><th>根拠</th><th>規定・要求</th><th>計画</th><th>判定</th></tr>" +
  data.checks.map((r) => `<tr><td>${r.cat}</td><td>${r.item}</td><td>${r.basis}</td><td>${r.required}</td><td>${r.planned}</td><td class="${cls(r.result)}">${r.result}</td></tr>`).join("");
const lb = document.getElementById("lightbox");
document.getElementById("gallery").addEventListener("click", (e) => { if (e.target.tagName === "IMG") { lb.querySelector("img").src = e.target.src; lb.style.display = "flex"; } });
lb.addEventListener("click", () => (lb.style.display = "none"));
</script>
</body>
</html>
