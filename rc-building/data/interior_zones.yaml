# 設計上の問題（レンダー後に追記）。kind: 設計 / CG。confirm: 要施主確認
findings:
  - {id: ZQ-01, cuts: [Z1-11, Z1-12, Z1-33, Z2-11, Z2-21, Z2-12, Z2-13, Z2-33], kind: 設計, confirm: true, text: "窓の外は空・遠景の木・周辺建物が写るが、室内（平均輝度 110〜170）より暗く、窓領域の平均が画像平均の 0.2〜0.9 倍になる（自動検査の「窓の外が見えない」8 カット）。15:30 の昼でも外が沈んで見える。窓ガラス（gain/shield）の透過率と、室内灯 100% の組合せを施主に確認する"}
  - {id: ZQ-02, cuts: [Z2-31], kind: CG, confirm: true, text: "シアターの W1・W2 仕上げが正面・後壁に出ておらず（クリーム色）、側壁だけが黒。平均輝度が上限（150）を超える（a 151・b 195。露出は +0.5 から 0.0 へ 1 回戻した）。仕上げの塗り分けの確認と別タスクでの修正が必要"}
  - {id: ZQ-03, cuts: [Z1-32], kind: CG, confirm: false, text: "機械室（西系統）を東へ向けた b は、暗い壁と薄い箱だけで設備（設備箱・配管）が見えない。設備の表現が欠落している可能性（CG 側）"}
  - {id: ZQ-04, cuts: [Z2-32], kind: CG, confirm: false, text: "WIC（主寝室）を南へ向けた a は収納パネルの壁だけで、棚・耐火金庫が見えない（標準偏差 17）。家具の欠落または壁面に近すぎる（正面 2,100mm）"}
  - {id: ZQ-05, cuts: [Z2-23], kind: CG, confirm: false, text: "脱衣所の西向き b に、ロボットのドックが写っていない。家具の欠落（CG 側）"}
  - {id: ZQ-06, cuts: [Z2-12], kind: 設計, confirm: true, text: "図書室の西窓は直射が約 2.7m 入る予測だが、a の画像では日だまりが見えない。窓が帯状で小さく、外が暗く沈む（ZQ-01）。日射の入り方の再確認"}
  - {id: ZQ-07, cuts: [Z2-33], kind: CG, confirm: false, text: "（v4.43 でカットを 2F シャワーへ移した。撮り直しまで旧記録）主寝室の北向き a に、ナイトテーブルが写っていない（北窓と壁だけ）。家具の欠落（CG 側）"}
