# v4.34 各階の天井視点の見下ろし 2 枚（T1・T2）＋各室の斜めカット 37 枚（R）。夏至 6/21 8:00 の自然昼光・視点 FL+1,600。
# 設定・対象室・除外・個別上書き（override）はこの先頭部分を手で直す。末尾の「cuts:」以降は src/render_rooms.py --plan が座標を固定して書く（override は保持）。
# 座標は建物座標 mm（北＝+Y）。yaw は建物座標の数学角（東＝0°、北＝90°）。
settings:
  version: v4.34
  when: "2026-06-21T08:00"        # 夏至。JST 8:00。太陽高度 40.4°・方位 88.1°（真北から東回り、建物座標で 75.8°）
  eye_above_fl_mm: 1600           # 身長 160cm の人の目線の高さ。z = 1F 3,100 / 2F 6,500
  look_dist_mm: 3000
  lens_std: 26                    # 水平 69.4°
  lens_small: 24                  # 10㎡未満・正面 2,500 未満（水平 73.7°）
  lens_exception: 22              # 後退できない室だけ（水平 78.6°）
  shift_y: -0.06
  pitch: 0
  exposure: -0.5
  exposure_theater: 0.5
  wb: 5500                        # カメラのホワイトバランス = 昼光の目標色温度（D55 相当）
  sun_k: 3900                     # 太陽ランプの色温度。当初案 5,000K は白い板の実測が 6,544K（目標 5,500±300K の外）。空（HDRI）が太陽より青く強いため、ランプを 3,900K まで赤くして合計を合わせた（実測は試験で確認）
  channels: {L: [5000, 100], D: 0, F: 0}   # ライン LED 5,000K・100%（昼光に最も近い上限）、ダウンライトと足元灯は消灯
  screens: auto                   # 直射を受ける東面だけ下ろす。寝室の完全遮光生地は起床後に上げる仮定（要施主確認）
  adaptive_threshold: 0.05
  chunk: 6                        # Blender を起動し直す単位
  jpeg_quality: 85
  band_px: 52
  room: {resolution: [1280, 720], samples: 64, time_limit: 150, preview: {resolution: [480, 270], samples: 16, time_limit: 90}}
  plan: {resolution: [1600, 1600], samples: 64, time_limit: 300, preview: {resolution: [400, 400], samples: 16, time_limit: 90},
         ortho_scale_m: 20.0, center: [9125, 9125], cam_above_fl_mm: 2800, clip_mm: 400, section_above_fl_mm: 2400, exposure: -0.5}
  placement: {corner_inset_mm: 700, inset_step_mm: 100, inset_max_mm: 1500, angle_deg: [25, 65], door_stand_mm: 450}
  white_plate: {target_k: 5500, tol_k: 300, sun_k_range: [3500, 5800], first_try_k: 5000, first_try_cct: 6544}   # 範囲は仕様の 4,800〜5,800 から下を広げた（4,800 でも 6,371K で外れるため）
checks:
  clearance_min_mm: 400
  front_min_mm: 1500
  angle_deg: [25, 65]
  black: {thr: 5, max: 0.05, max_theater: 0.20}
  white: {thr: 250, max: 0.03, max_direct: 0.08}
  mean: [70, 185]
  mean_theater: [35, 150]
  mean_plan: [60, 190]
  std_min: 12
  window: {mean_ratio: 1.2, std_min: 8, min_area: 0.02}
